out+=shell(13,`<h2>References</h2><p>Hu, Vincent C., Rick Kuhn, and Dylan Yaga. “Verification and test methods for access control policies/models.” NIST Special Publication 800 (2017): 192.</p><p>Joint Task Force. “Assessing security and privacy controls in information systems and organizations.” NIST Special Publication (2021).</p><p>Scarfone, Karen, et al. “Technical guide to information security testing and assessment.” NIST Special Publication 800.115 (2008): 2-25.</p><p>ISO/SAE 21434 Road vehicles - Cybersecurity engineering: First edition 2021-08.</p>`);
